principles:
  - title: Local-first
    body: The default path works on your computer. A cloud account is not required.
  - title: Fail-closed
    body: If a check cannot prove the result is safe, the tool stops. Missing evidence is treated as a failure.
  - title: Proof, not posture
    body: I separate public source, tags, formal releases, access checks, deployment, launch, and adoption. I do not invent later lifecycle states.
footnote: Public products only. Unproven claims are rejected. No invented numbers.
glossary:
  - term: Local-first
    meaning: The tool works on your computer. A cloud account is not required.
  - term: Fail-closed
    meaning: If a check cannot prove the result is safe, the command stops. Missing evidence is treated as a failure.
  - term: Drift check
    meaning: A comparison that fails when the catalog no longer matches the files it describes.
  - term: BM25
    meaning: A standard keyword search ranker. Hit@1 means the right page ranked first. Hit@5 means it ranked in the top five.
  - term: Synthetic fixture
    meaning: Made-up example data used in tests and screenshots. Not a real resume or job history.
  - term: Receipt
    meaning: A local file that records what happened so you can check it later.
